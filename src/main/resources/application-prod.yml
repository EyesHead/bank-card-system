server:
  port: ${PORT:8080}

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Только проверка схемы
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    drop-first: false

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
    encryption:
      cardNumber:
        secret-key: ${ENCRYPTION_SECRET}
    admin:
      password: ${ADMIN_PASSWORD}
      username: ${ADMIN_USERNAME}

springdoc:
  swagger-ui:
    enabled: false