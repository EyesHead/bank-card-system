server:
  port: 8080

spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: '${DB_URL:jdbc:postgresql://localhost:5432/bank_cards}'
    username: '${DB_USERNAME:postgres}'
    password: '${DB_PASSWORD:postgres}'
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none  # Liquibase приоритет на создание сущностей
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    drop-first: true

application:
  security:
    jwt:
      secret-key: '${JWT_SECRET:01234567890123456789012345678901}'
    encryption:
      cardNumber:
        secret-key: '${ENCRYPTION_SECRET: 01234567890123456789012345678901}'

springdoc:
  swagger-ui:
    enabled: true