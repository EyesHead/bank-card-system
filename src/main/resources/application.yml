spring:
  application:
    name: bank-cards
  profiles:
    active: dev
  jpa:
    open-in-view: false
  liquibase:
    change-log: classpath:db/migration/changelog-master.yaml

application:
  security:
    jwt:
      expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method